<style>
/* Layout: app de campo, uma coluna, barra superior fixa e acoes grandes no rodape (estilo etiqueta de gondola) */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface2:#e3e9e8; --ink:#14201f; --muted:#5a6967; --line:#c9d3d1;
  --brand:#0f3b3a; --brand-ink:#ffffff; --tag:#ffd23f; --tag-ink:#1b1a10;
  --ok:#1f7a4d; --ok-bg:#d9efe3; --warn:#9a5b00; --warn-bg:#fdebc8; --bad:#b3261e; --bad-bg:#f9dedc; --info-bg:#dceaf3;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#16211f; --surface2:#1e2b29; --ink:#e4ecea; --muted:#93a4a1; --line:#2c3b39;
  --brand:#123f3d; --brand-ink:#f2f7f6; --tag:#ffd23f; --tag-ink:#1b1a10;
  --ok:#6fd3a0; --ok-bg:#163527; --warn:#f2b45a; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1714; --info-bg:#173040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#16211f; --surface2:#1e2b29; --ink:#e4ecea; --muted:#93a4a1; --line:#2c3b39;
  --brand:#123f3d; --brand-ink:#f2f7f6; --tag:#ffd23f; --tag-ink:#1b1a10;
  --ok:#6fd3a0; --ok-bg:#163527; --warn:#f2b45a; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1714; --info-bg:#173040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.top h1{font:700 22px/1.1 var(--f-display);letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top .back{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--brand-ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.sync{font:500 12px var(--f-mono);padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap;cursor:pointer;border:0;color:var(--brand-ink)}
.sync.off{background:var(--tag);color:var(--tag-ink)}

.muted{color:var(--muted)} .small{font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.tile:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input.in,select.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.f2.st{grid-template-columns:1fr}}
.pill{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}

/* etiqueta de preco */
.tagcard{background:var(--tag);color:var(--tag-ink);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.tagcard .nm{font:700 24px/1.08 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}

.chk input{width:22px;height:22px;accent-color:var(--brand)}

.chk.of.on{border-color:var(--warn);background:var(--warn-bg)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.foot .btn{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.min{background:var(--ok-bg);color:var(--ok);font-weight:600}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,15,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.video{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video:after{content:"";position:absolute;left:10%;right:10%;top:48%;height:2px;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph label{border:2px dashed var(--line);border-radius:var(--r);aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background:var(--surface);font-size:13px;color:var(--muted);padding:6px}
.ph img{width:100%;height:100%;object-fit:cover}
.ph input{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;max-width:90%;text-align:center}
.err{color:var(--bad);font-weight:600;font-size:13px}
.boot{padding:40px 20px;text-align:center}
.brandmark{font:700 40px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brandmark em{font-style:normal;background:var(--tag);color:var(--tag-ink);padding:0 8px;border-radius:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>"use strict";

const APPV = "G3.0";

const $ = s => document.querySelector(s);

const esc = v => String(v ?? "").replace(/[&<>"']/g, (c => ({
 "&": "&amp;",
 "<": "&lt;",
 ">": "&gt;",
 '"': "&quot;",
 "'": "&#39;"
}[c])));

const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const now = () => Date.now();

const fmtD = t => t ? new Date(t).toLocaleDateString("pt-BR") : "";

const fmtDT = t => t ? new Date(t).toLocaleString("pt-BR", {
 day: "2-digit",
 month: "2-digit",
 year: "2-digit",
 hour: "2-digit",
 minute: "2-digit"
}) : "";

const today = () => (new Date).toISOString().slice(0, 10);

const money = v => v == null || v === "" ? "" : Number(v).toLocaleString("pt-BR", {
 minimumFractionDigits: 2,
 maximumFractionDigits: 2
});

const pnum = v => {
 if (v == null) return null;
 v = String(v).trim().replace(/[R$\s]/g, "");
 if (!v) return null;
 if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
 const n = Number(v);
 return isFinite(n) ? n : null;
};

const tmo = (p, ms) => Promise.race([ p, new Promise(((_, rej) => setTimeout((() => rej(new Error("timeout"))), ms))) ]);

const bootMsg = m => {
 const b = document.getElementById("bootMsg");
 if (b) b.textContent = m;
};

const idle = () => new Promise((r => (window.requestIdleCallback || setTimeout)(r, {
 timeout: 200
})));

function toast(m, ms = 2200) {
 const t = $("#toast");
 t.textContent = m;
 t.hidden = false;
 t.className = "toast";
 clearTimeout(toast._t);
 toast._t = setTimeout((() => t.hidden = true), ms);
}

const KV = {
 db: null,
 mem: {},
 async open() {
  try {
   this.db = await tmo(new Promise(((res, rej) => {
    const r = indexedDB.open("pesquisa_precos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error("blocked"));
   })), 4e3);
  } catch (e) {
   this.db = null;
   try {
    const ls = localStorage.getItem("pp_mem");
    if (ls) this.mem = JSON.parse(ls);
   } catch (x) {}
  }
 },
 async get(k) {
  if (!this.db) return this.mem[k];
  try {
   return await tmo(new Promise(((res, rej) => {
    const r = this.db.transaction("kv").objectStore("kv").get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
   })), 3e3);
  } catch (e) {
   return this.mem[k];
  }
 },
 async set(k, v) {
  this.mem[k] = v;
  if (!this.db) {
   if (k !== "prodBase") try {
    const m = {
     ...this.mem
    };
    delete m.prodBase;
    localStorage.setItem("pp_mem", JSON.stringify(m));
   } catch (e) {}
   return;
  }
  try {
   await new Promise(((res, rej) => {
    const t = this.db.transaction("kv", "readwrite");
    t.objectStore("kv").put(v, k);
    t.oncomplete = res;
    t.onerror = () => rej(t.error);
   }));
  } catch (e) {}
 },
 _p: {},
 save(k) {
  clearTimeout(this._p[k]);
  this._p[k] = setTimeout((() => this.set(k, S[k])), 250);
 }
};

const S = {
 user: null,
 prodBaseVer: "orig",
 prods: new Map,
 prodArr: [],
 eanIdx: new Map,
 famIdx: new Map,
 prodEdits: {},
 lojas: [],
 concs: [],
 vinc: [],
 users: [],
 listas: {},
 coletas: {},
 aux: {},
 queue: [],
 cfg: {
  wa: ""
 },
 token: null,
 pesq: [],
 pesqItens: {},
 rej: [],
 allSeqs: [],
 envios: [],
 fotos: {},
 online: navigator.onLine
};

function mkProd(r) {
 return {
  seq: +r.seq,
  nome: r.nome || "",
  ean: r.ean || "",
  n1: r.n1 || "",
  n2: r.n2 || "",
  n3: r.n3 || "",
  n4: r.n4 || "",
  n5: r.n5 || "",
  avo: r.avo ?? "",
  alt: r.alt ?? "",
  fam: r.fam ?? "",
  perc: r.perc ?? 100,
  custo: r.custo ?? 0
 };
}

function indexProd(p) {
 p._k = norm(p.nome + " " + p.seq + " " + p.ean + " " + p.n4 + " " + p.n5);
}

async function loadBase() {
 const rows = await KV.get("prodBase") || [];
 S.prodBaseVer = await KV.get("prodBaseVer") || "";
 S.prods = new Map;
 rows.forEach((r => S.prods.set(+r.seq, mkProd(r))));
 Object.values(S.prodEdits).forEach((e => applyEdit(e, false)));
 rebuildIdx();
}

const arr2prod = a => ({
 seq: +a[0],
 nome: String(a[1] ?? ""),
 ean: String(a[2] ?? ""),
 n1: a[3] ?? "",
 n2: a[4] ?? "",
 n3: a[5] ?? "",
 n4: a[6] ?? "",
 n5: a[7] ?? "",
 avo: a[8] ?? "",
 alt: a[9] ?? "",
 fam: a[10] ?? "",
 perc: a[11] === "" ? 100 : a[11],
 custo: a[12] === "" ? 0 : a[12]
});

async function downloadBase() {
 const info = await gs("baseInfo", authA());
 const per = 8e3;
 let rows = [];
 for (let off = 0; off < info.n; off += per) {
  bootMsg(`Baixando base de produtos: ${Math.min(off + per, info.n).toLocaleString("pt-BR")} de ${info.n.toLocaleString("pt-BR")}\u2026`);
  const ch = await gs("getProd", authA(), off, per);
  rows = rows.concat(ch.map(arr2prod));
 }
 await KV.set("prodBase", rows);
 await KV.set("prodBaseVer", info.ver);
 clearEdits();
 S.cfg.prodSince = info.now;
 KV.save("cfg");
 await loadBase();
}

function applyEdit(e, rb = true) {
 if ((e.baseVer || "") !== S.prodBaseVer) return;
 if (e.del) S.prods.delete(+e.seq); else S.prods.set(+e.seq, mkProd(e));
 if (rb) rebuildIdx();
}

function rebuildIdx() {
 S.prodArr = [ ...S.prods.values() ];
 S.allSeqs = S.prodArr.map((p => p.seq));
 COLV++;
 S.eanIdx = new Map;
 S.famIdx = new Map;
 for (const p of S.prodArr) {
  indexProd(p);
  String(p.ean).split(/[,;\s]+/).filter(Boolean).forEach((e => S.eanIdx.set(e.replace(/^0+/, ""), p)));
  if (p.fam !== "") {
   const a = S.famIdx.get(p.fam);
   a ? a.push(p.seq) : S.famIdx.set(p.fam, [ p.seq ]);
  }
 }
}

const prodByEan = e => S.eanIdx.get(String(e).replace(/\D/g, "").replace(/^0+/, ""));

function searchProd(q, lim = 60, pool) {
 q = norm(q).trim();
 if (!q) return [];
 const tk = q.split(/\s+/);
 const out = [];
 for (const p of pool || S.prodArr) {
  if (tk.every((t => p._k.includes(t)))) {
   out.push(p);
   if (out.length >= lim) break;
  }
 }
 return out;
}

async function loadAll() {
 bootMsg("Abrindo armazenamento do aparelho\u2026");
 await KV.open();
 bootMsg("Lendo dados salvos\u2026");
 for (const k of [ "prodEdits", "lojas", "concs", "vinc", "users", "listas", "coletas", "aux", "queue", "cfg", "pesq", "pesqItens", "rej", "envios", "fotos" ]) {
  const v = await KV.get(k);
  if (v != null) S[k] = v;
 }

const API_URL = "https:/\/script.google.com/macros/s/AKfycbyWsqYdBCMgIEfpxyEcqC4XOFq0W9Dbz03FiA8hEMqv8ivmYX01vX6VFlwf6cOGqc-B/exec";

const HAS_RUN = !!(window.google && google.script && google.script.run);

const HAS_GS = HAS_RUN || /^https:/.test(API_URL);

const IN_FRAME = (() => {
 try {
  return window.top !== window.self;
 } catch (e) {

 }

const parseR = r => {
 try {
  return typeof r === "string" ? JSON.parse(r) : r;
 } catch (e) {
  return r;
 }
};

function gs(fn, ...a) {
 if (HAS_RUN) return new Promise(((res, rej) => {
  google.script.run.withSuccessHandler((r => res(parseR(r)))).withFailureHandler(rej)[fn](...a);
 }));
 if (!HAS_GS) return Promise.reject(new Error("Sem servidor Google"));
 const ctl = new AbortController;
 const tm = setTimeout((() => ctl.abort()), 12e4);
 return fetch(API_URL, {
  method: "POST",
  headers: {
   "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
   fn: fn,
   args: a
  }),
  signal: ctl.signal,
  redirect: "follow"
 }).then((r => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
 })).then((j => {
  if (j.err) throw new Error(j.err);
  return parseR(j.ok);
 })).catch((e => {
  throw new Error(e.name === "AbortError" ? "Tempo esgotado" : errTxt(e));
 })).finally((() => clearTimeout(tm)));
}

function enqueue(col, id, data) {
 id = String(id).replace(/[^\w-]/g, "_");
 S.queue = S.queue.filter((o => o._f || !(o.col === col && o.id === id)));
 S.queue.push({
  col: col,
  id: id,
  data: data
 });
 KV.save("queue");

}

let flushing = false, pulling = false, syncErr = "", lastOk = 0;

async function flush() {
 if (!HAS_GS || !S.token || flushing || !navigator.onLine || !S.queue.length) return;
 flushing = true;
 try {
  while (S.queue.length && navigator.onLine) {
   let size = 0, batch = [];
   for (const o of S.queue) {
    const l = JSON.stringify(o).length;
    if (batch.length && (size + l > 15e5 || batch.length >= 25)) break;
    batch.push(o);
    size += l;
   }
   batch.forEach((o => o._f = true));
   let r;
   try {
    r = await gs("push", authA(), JSON.stringify(batch.map((o => ({
     col: o.col,
     id: o.id,
     data: o.data
    })))));
    syncErr = "";
    lastOk = now();
   } catch (e) {
    batch.forEach((o => delete o._f));
    syncErr = isAuthErr(e) ? "Sess\xe3o expirada: toque em Sair e entre de novo" : "Falha no envio: " + errTxt(e);
    break;
   }
   const errs = r && r.errors || [];
   const bad = new Set(errs.map((x => x.col + ":" + x.id)));
   errs.forEach((x => {
    const o = batch.find((b => b.col + ":" + b.id === x.col + ":" + x.id));
    S.rej = S.rej.filter((z => !(z.col === x.col && z.id === x.id)));
    S.rej.push({
     col: x.col,
     id: x.id,
     msg: x.msg,
     data: o ? o.data : null,
     dt: now()
    });
   }));
   if (errs.length) {
    KV.save("rej");
    syncErr = errs.length + " registro(s) recusado(s): " + errs[0].msg;
   }
   const sent = new Set(batch);
   S.queue = S.queue.filter((o => !sent.has(o)));
   KV.save("queue");
   renderSync();
   await idle();
  }
 } finally {
  flushing = false;
  renderSync();
 }
}

async function pull() {
 if (!HAS_GS || !S.token || pulling || !navigator.onLine) return;
 pulling = true;
 try {
  const r = await gs("pull", authA(), JSON.stringify({
   since: S.cfg.since || 0,
   prodSince: S.cfg.prodSince || 0,
   baseVer: S.prodBaseVer,
   pesqVer: S.cfg.pesqVer || ""
  }));
  lastOk = now();
  S.lojas = r.lojas;
  S.concs = r.concs;
  S.vinc = r.vinc;
  if (r.users) S.users = r.users;
  if (r.envios && !S.queue.some((o => o.col === "cadastros" && o.id === "envios"))) S.envios = r.envios;
  [ "lojas", "concs", "vinc", "users", "envios" ].forEach((k => KV.save(k)));
  if (r.me) {
   S.user = {
    ...S.user,
    ...r.me
   };
   KV.set("session", {
    user: S.user,
    token: S.token
   });
  }
  const pend = new Set(S.queue.map((o => o.col + ":" + o.id)));
  const mergeIn = (arr, store, col, key) => {
   (arr || []).forEach((d => {
    if (pend.has(col + ":" + d.id)) return;
    const loc = store[d.id];
    if (!loc || (d.upd || 0) >= (loc.upd || 0)) store[d.id] = d;
   }));
   KV.save(key);
  };
  mergeIn(r.listas, S.listas, "listas", "listas");
  mergeIn(r.coletas, S.coletas, "coletas", "coletas");
  mergeIn(r.auxiliar, S.aux, "auxiliar", "aux");
  mergeIn(r.fotos, S.fotos, "fotos", "fotos");
  const pendP = S.queue.filter((o => o.col === "pesquisas"));
  if (r.pesq) {
   S.pesq = r.pesq.filter((x => !pendP.some((o => o.id === x.id))));
   pendP.forEach((o => {
    if (o.data) S.pesq.push(pesqFromData(o.data));
   }));
   KV.save("pesq");
  }
  if (r.pesqItens) {
   const keep = {};
   pendP.forEach((o => {
    if (o.data && S.pesqItens[o.id]) keep[o.id] = S.pesqItens[o.id];
   }));
   S.pesqItens = {
    ...r.pesqItens,
    ...keep
   };
   S.cfg.pesqVer = r.pesqVer;
   KV.save("pesqItens");
  }
  COLV++;
  const rm = r.removed || {};
  (rm.listas || []).forEach((id => delete S.listas[id]));
  (rm.coletas || []).forEach((id => delete S.coletas[id]));
  (rm.auxiliar || []).forEach((id => delete S.aux[id]));
  (rm.fotos || []).forEach((id => delete S.fotos[id]));
  if (r.baseVer !== S.prodBaseVer || r.prodFull) {
   toast("Atualizando base de produtos\u2026", 4e3);
   await downloadBase();
  } else {
   let ch = 0;
   (r.prod || []).forEach((a => {
    const e = {
     ...arr2prod(a),
     upd: now(),
     baseVer: S.prodBaseVer
    };
    S.prodEdits[e.seq] = e;
    applyEdit(e, false);
    ch++;
   }));
   (rm.produtos || []).forEach((q => {
    const e = {
     seq: +q,
     del: true,
     baseVer: S.prodBaseVer
    };
    S.prodEdits[q] = e;
    applyEdit(e, false);
    ch++;
   }));
   if (ch) {
    rebuildIdx();
    KV.save("prodEdits");
   }
   S.cfg.prodSince = r.now;
  }
  S.cfg.since = r.now;
  S.cfg.lastPull = now();
  KV.save("cfg");
  if (!syncErr.startsWith("Sess\xe3o")) syncErr = "";
  softRender();
 } catch (e) {
  syncErr = isAuthErr(e) ? "Sess\xe3o expirada: toque em Sair e entre de novo" : "Falha ao receber dados: " + errTxt(e);
 } finally {
  pulling = false;
  renderSync();
  flush();
 }
}

function eanSvg(code) {
 code = String(code).replace(/\D/g, "");
 if (code.length === 12) {
  let s = 0;
  for (let i = 0; i < 12; i++) s += +code[i] * (i % 2 ? 3 : 1);
  code += (10 - s % 10) % 10;
 }
 if (code.length !== 13) return "";
 const L = [ "0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011" ];
 const R = L.map((x => x.replace(/./g, (b => b === "0" ? "1" : "0"))));
 const G = R.map((x => [ ...x ].reverse().join("")));
 const P = [ "LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL" ][+code[0]];
 let bits = "101";
 for (let i = 1; i < 7; i++) bits += (P[i - 1] === "L" ? L : G)[+code[i]];
 bits += "01010";
 for (let i = 7; i < 13; i++) bits += R[+code[i]];
 bits += "101";
 let r = "";
 const w = 2;
 for (let i = 0; i < bits.length; i++) if (bits[i] === "1") {
  const g = i < 3 || i >= 45 && i < 50 || i >= 92;
  r += `<rect x="${(i + 9) * w}" y="0" width="${w}" height="${g ? 58 : 50}" fill="#111"/>`;
 }
 const tx = `<text x="2" y="70" font-family="monospace" font-size="15" fill="#111">${code[0]}</text><text x="${(9 + 3 + 21) * w}" y="70" font-family="monospace" font-size="15" fill="#111" text-anchor="middle">${code.slice(1, 7)}</text><text x="${(9 + 50 + 21) * w}" y="70" font-family="monospace" font-size="15" fill="#111" text-anchor="middle">${code.slice(7)}</text>`;
 return `<svg viewBox="0 0 ${(95 + 18) * w} 74" width="226" height="74" role="img" aria-label="EAN ${code}"><rect width="100%" height="100%" fill="#fff"/>${r}${tx}</svg>`;
}

let COLV = 0;

const DIAS = [ "DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SAB" ];

const DIAS_N = {
 DOM: "domingo",
 SEG: "segunda",
 TER: "ter\xe7a",
 QUA: "quarta",
 QUI: "quinta",
 SEX: "sexta",
 SAB: "s\xe1bado",
 QUALQUER: "qualquer dia"
};

const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const addDays = (s, n) => {
 const d = new Date(s + "T12:00:00");
 d.setDate(d.getDate() + n);
 return ymd(d);
};

const hojeS = () => ymd(new Date);

const fmtYmd = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";

function pesqFromData(d) {
 return {
  id: d.id,
  nome: d.nome,
  lojas: d.lojas,
  dia: d.dia,
  validade: d.validade,
  todos: d.todos,
  concs: d.concs,
  pesq: d.pesq,
  ativa: d.ativa
 };
}

const pesqBy = id => S.pesq.find((m => String(m.id) === String(id)));

const isTodos = v => String(v).toUpperCase() === "S" || v === true;

function pesqLojas(m) {
 const s = String(m.lojas || "").toUpperCase().trim();
 const at = S.lojas.filter((l => l.status !== "Desativado")).map((l => +l.cod));
 return !s || s === "TODAS" ? at : s.split(/[,;\s]+/).filter(Boolean).map(Number);
}

function cicloAtual(m, hoje = hojeS()) {
 const V = Math.max(1, parseInt(m.validade) || 7);
 const dia = String(m.dia || "").toUpperCase().slice(0, 3);
 const wi = DIAS.indexOf(dia);
 let ini;
 if (wi >= 0) {
  const d = new Date(hoje + "T12:00:00");
  ini = addDays(hoje, -((d.getDay() - wi + 7) % 7));
 } else {
  const anc = "2026-01-05";
  const days = Math.round((new Date(hoje + "T12:00:00") - new Date(anc + "T12:00:00")) / 864e5);
  ini = addDays(anc, Math.floor(days / V) * V);
 }
 const fim = addDays(ini, V - 1);
 return hoje <= fim ? {
  ini: ini,
  fim: fim
 } : {
  ini: null,
  fim: fim,
  prox: addDays(ini, wi >= 0 ? 7 : V)
 };
}

function pesqConcs(m, loja) {
 const pz = String(m.pesq || "").trim();
 const only = String(m.concs || "").split(/[,;\s]+/).filter(Boolean).map(Number);
 return [ ...new Set(S.vinc.filter((v => +v.loja === +loja && (!pz || String(v.pesquisador).split("/").map((x => x.trim())).includes(pz)))).map((v => +v.conc))) ].filter((c => (!only.length || only.includes(c)) && (concBy(c) || {}).status !== "Inativo"));
}

function rodadasAtuais() {
 const u = S.user;
 const out = [];
 const mine = u.perfil === "LOJA" ? userLojas(u) : null;
 for (const m of S.pesq) {
  if (String(m.ativa).toUpperCase() === "N") continue;
  const c = cicloAtual(m);
  if (!c.ini) continue;
  for (const loja of pesqLojas(m)) {
   if (mine && !mine.includes(+loja)) continue;
   const id = `R-${m.id}-${loja}-${c.ini.replace(/-/g, "")}`;
   if (S.listas[id]) {
    out.push(S.listas[id]);
    continue;
   }
   const cs = pesqConcs(m, loja);
   if (!cs.length) continue;
   out.push({
    id: id,
    virtual: true,
    modelo: m.id,
    modeloNome: m.nome,
    nome: m.nome,
    loja: +loja,
    concs: cs,
    inicio: c.ini,
    validade: c.fim,
    prevista: c.ini,
    status: "Pendente",
    criadoPor: "AUTO",
    finConcs: []
   });
  }
 }
 return out;
}

function getLista(id) {
 if (S.listas[id]) return S.listas[id];
 return rodadasAtuais().find((r => r.id === id));
}

function itensOf(l) {
 if (!l) return [];
 if (isTodos(l.todos)) return S.allSeqs;
 if (l.modelo) {
  const m = pesqBy(l.modelo);
  if (m) {
   if (isTodos(m.todos)) return S.allSeqs;
   return S.pesqItens[m.id] || [];
  }
 }
 return l.itens || [];
}

const expirada = l => !!(l.validade && hojeS() > l.validade && l.status !== "Conclu\xedda");

const stOf = l => expirada(l) ? "Expirada" : l.status || "Pendente";

function materializa(l) {
 if (!l.virtual) return l;
 const o = {
  ...l
 };
 delete o.virtual;
 o.criada = now();
 saveLista(o);
 return o;
}

function todasListas() {
 const u = S.user;
 const vis = l => u.perfil !== "LOJA" || userLojas(u).includes(+l.loja);
 const m = new Map;
 Object.values(S.listas).filter(vis).forEach((l => m.set(l.id, l)));
 rodadasAtuais().forEach((l => {
  if (!m.has(l.id)) m.set(l.id, l);
 }));
 return [ ...m.values() ];
}

function pesqEditView(d) {
 const byB = {};
 S.lojas.filter((l => l.status !== "Desativado")).forEach((l => (byB[l.bandeira] = byB[l.bandeira] || []).push(l)));
 const pes = [ ...new Set(S.vinc.flatMap((v => String(v.pesquisador).split("/").map((s => s.trim())))).filter(Boolean)) ].sort();
 const nC = d.todasLojas ? S.lojas.filter((l => l.status !== "Desativado")).length : d.lojas.length;

 })).join("")}</div></div>`)).join("")}</div>\n   ${pickerHtml(d)}<p class="err" id="nlErr"></p>`, {
  foot: `${d.id ? `<button class="btn bad" data-act="peDel">Excluir</button>` : ""}<button class="btn pri" style="flex:2" data-act="peSave">Salvar pesquisa</button>`
 });

function savePesq(m, itens) {
 const data = {
  ...m,
  itens: isTodos(m.todos) ? [] : itens,
  upd: now()
 };
 const i = S.pesq.findIndex((x => x.id === m.id));
 if (i >= 0) S.pesq[i] = pesqFromData(m); else S.pesq.push(pesqFromData(m));
 if (!isTodos(m.todos)) S.pesqItens[m.id] = [ ...itens ]; else delete S.pesqItens[m.id];
 KV.save("pesq");
 KV.save("pesqItens");
 COLV++;
 enqueue("pesquisas", m.id, data);
}

VIEWS.analise = () => {
 const l = getLista(V.id);
 const cs = l.concs;
 let IT = itensOf(l);
 if (IT.length > 600) IT = IT.filter((s => cs.some((c => S.coletas[`${l.id}-${c}-${s}`]))));
 const rows = IT.map((s => {
  const p = S.prods.get(s);
  const v = cs.map((c => {
   const x = S.coletas[`${l.id}-${c}-${s}`];
   return x && !x.naoEnc ? x : null;
  }));
  const pr = v.map((x => x ? x.reg ?? x.club ?? x.caixa ?? x.app : null));
  const mn = Math.min(...pr.filter((x => x != null)));
  return `<tr><td class="mono">${s}</td><td>${esc(p ? p.nome : "")}</td>${pr.map(((x, i) => `<td class="n ${x != null && x === mn && pr.filter((y => y != null)).length > 1 ? "min" : ""}">${x != null ? money(x) + (v[i].oferta ? " \u2605" : "") : "\u2013"}</td>`)).join("")}</tr>`;
 })).join("");
 return shell("Comparar pre\xe7os", `<p class="muted small">${esc(l.nome)} \xb7 ${esc(lojaNome(l.loja))}. Menor pre\xe7o regular em verde; \u2605 = oferta.</p><div class="tw"><table><thead><tr><th>SEQ</th><th>Produto</th>${cs.map((c => `<th>${esc(concNome(c))}</th>`)).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`);
};

VIEWS.bases = () => {
 const t = V.t || "produtos";
 const D = DEFS[t];
 const tabs = Object.keys(DEFS).filter((k => k === "produtos" || k === "vinc" ? true : k === "envios" ? isPricing() : isAdm()));
 const q = V.q || "";
 const pg = V.pg || 0;
 let rows = D.rows();
 if (q.trim()) {
  if (t === "produtos") rows = searchProd(q, 5e3); else {
   const tk = norm(q).split(/\s+/);
   rows = rows.filter((r => {
    const s = norm(D.cols.map((c => r[c[0]])).join(" "));
    return tk.every((x => s.includes(x)));
   }));
  }
 }
 const per = 50;
 const page = rows.slice(pg * per, pg * per + per);
 return shell("Bases", `<div class="tabs">${tabs.map((k => `<button class="${t === k ? "on" : ""}" data-act="bt" data-t="${k}">${DEFS[k].t}</button>`)).join("")}</div>\n   <div class="row"><input class="in" style="flex:1" id="bq" placeholder="Pesquisar em ${esc(D.t.toLowerCase())}" value="${esc(q)}" autocomplete="off">${D.can() ? `<button class="btn pri" data-act="bnew">+ Incluir</button>` : ""}</div>\n   <div class="row small muted" style="justify-content:space-between"><span>${rows.length.toLocaleString("pt-BR")} registro(s)</span><span>${D.can() ? "Toque numa linha para editar ou excluir" : "Somente consulta"}</span></div>\n   <div class="tw"><table><thead><tr>${D.cols.map((c => `<th>${esc(c[1])}</th>`)).join("")}</tr></thead><tbody>${page.map((r => `<tr class="click" data-act="bedit" data-k="${esc(r[D.key])}">${D.cols.map((c => `<td class="${c[0] === "nome" || c[0] === "_cn" || c[0] === "empresa" ? "" : ""}">${esc(r[c[0]])}</td>`)).join("")}</tr>`)).join("")}</tbody></table></div>\n   <div class="row" style="justify-content:center"><button class="btn sm" data-act="bpg" data-d="-1" ${pg ? "" : "disabled"}>\u2039 Anterior</button><span class="mono small">${pg + 1}/${Math.max(1, Math.ceil(rows.length / per))}</span><button class="btn sm" data-act="bpg" data-d="1" ${(pg + 1) * per < rows.length ? "" : "disabled"}>Pr\xf3xima \u203a</button></div>\n   ${D.can() ? `<div class="card"><h3>Importar / exportar ${esc(D.t)}</h3><p class="muted small">Exporte, edite no Excel e importe de volta (CSV com \u201c;\u201d ou .xlsx, mesmas colunas). A importa\xe7\xe3o substitui a base inteira na planilha e em todos os aparelhos.${t === "produtos" ? " Voc\xea tamb\xe9m pode editar direto na aba PRODUTOS da planilha." : ""}</p><div class="row"><button class="btn sm" data-act="bexp" data-fmt="xlsx">Exportar .xlsx</button><button class="btn sm" data-act="bexp" data-fmt="csv">Exportar .csv</button>${t !== "produtos" || isAdm() ? `<button class="btn sm" data-act="bimp">Importar arquivo</button>` : ""}${t === "produtos" && HAS_GS ? `<button class="btn sm" data-act="brestore">Baixar base de novo</button>` : ""}</div></div>` : ""}`);
};

function editForm(t, k) {
 const D = DEFS[t];
 const r = k == null ? {} : D.rows().find((x => String(x[D.key]) === String(k))) || {};
 const can = D.can();
 modal(`<h3>${k == null ? "Incluir" : can ? "Editar" : "Detalhe"} \xb7 ${esc(D.t)}</h3><form id="fed" class="card" style="border:0;padding:0;background:transparent">${D.fields.map((([f, lab, ty]) => `<label class="f">${esc(lab)}<input class="in ${ty === "n" ? "mono" : ""}" name="${f}" ${ty === "n" ? 'inputmode="decimal"' : ""} value="${esc(r[f] ?? "")}" ${can ? "" : "readonly"} ${(f === D.key || t === "vinc" && (f === "loja" || f === "conc")) && k != null ? "readonly" : ""}></label>`)).join("")}\n  ${t === "produtos" && k != null && r.fam !== "" ? `<p class="muted small">Fam\xedlia ${esc(r.fam)}: ${(S.famIdx.get(r.fam) || []).length} produto(s).</p>` : ""}<p class="err" id="edErr"></p>\n  <div class="row">${can && k != null ? `<button type="button" class="btn bad" data-act="bdel" data-t="${t}" data-k="${esc(k)}">Excluir</button>` : ""}<button type="button" class="btn grow" data-act="mclose">Fechar</button>${can ? `<button class="btn pri grow" type="submit">Salvar</button>` : ""}</div></form>`);
 $("#fed").onsubmit = e => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const err = m => $("#edErr").textContent = m;
  D.fields.forEach((([f, , ty]) => {
   if (ty === "n" && fd[f] !== "" && fd[f] != null) {
    const n = pnum(fd[f]);
    if (n == null) return;
    fd[f] = n;
   }
  }));
  if (t === "produtos") {
   if (!fd.seq && fd.seq !== 0) return err("Informe o SEQ-PRODUTO");
   if (k == null && S.prods.has(+fd.seq)) return err("SEQ j\xe1 existe na base");
   if (!fd.nome) return err("Informe o nome");
   saveProd(fd);
  } else {
   const arr = S[t];
   if (t === "vinc") {
    fd._k = fd.loja + "-" + fd.conc;
    if (!lojaBy(fd.loja)) return err("Loja n\xe3o existe na base de lojas");
    if (!concBy(fd.conc)) return err("Concorrente n\xe3o existe na base");
   }
   if (!fd[D.key]) return err("Campo obrigat\xf3rio: " + D.fields[0][1]);
   if (t === "users") {
    fd.login = String(fd.login).toUpperCase();
    fd.perfil = String(fd.perfil).toUpperCase();
    if (![ "MASTER", "PRICING", "LOJA" ].includes(fd.perfil)) return err("Perfil deve ser MASTER, PRICING ou LOJA");
   }
   const i = arr.findIndex((x => String(t === "vinc" ? x.loja + "-" + x.conc : x[D.key]) === String(k ?? fd[D.key])));
   if (k == null && i >= 0) return err("J\xe1 existe um registro com essa chave");
   const clean = {
    ...fd
   };
   delete clean._k;
   if (i >= 0) arr[i] = {
    ...arr[i],
    ...clean
   }; else arr.push(clean);
   saveCad(t);
  }
  mclose();
  toast("Salvo");
  render();
 };
}

function toCsv(rows) {
 if (!rows.length) return "\ufeff";
 const h = Object.keys(rows[0]);
 const q = v => {
  v = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? "");
  return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
 };
 return "\ufeff" + [ h.join(";"), ...rows.map((r => h.map((k => q(r[k]))).join(";"))) ].join("\r\n");
}

function toBlob(rows, fmt, sheet = "Dados", more) {
 if (fmt === "xlsx" && window.XLSX) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [ {} ]), sheet);
  (more || []).forEach((([n, r]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(r.length ? r : [ {} ]), n)));
  return new Blob([ XLSX.write(wb, {
   bookType: "xlsx",
   type: "array"
  }) ], {
   type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });
 }
 return new Blob([ toCsv(rows) ], {
  type: "text/csv"
 });
}

const dataURLBlob = d => {
 const [h, b] = d.split(",");
 const bin = atob(b);
 const a = new Uint8Array(bin.length);
 for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
 return new Blob([ a ], {
  type: h.slice(5).split(";")[0]
 });
};

const safeName = x => String(x).replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();

function txtFiles(listaIds) {
 const files = new Map;
 let semEan = 0, semPreco = 0;
 for (const lid of listaIds) {
  const l = getLista(lid) || S.listas[lid];
  if (!l) continue;
  const cols = Object.values(S.coletas).filter((c => c.lista === lid && !c.naoEnc));
  for (const c of cols) {
   const preco = c.reg ?? c.club ?? c.caixa ?? c.app;
   if (preco == null) {
    semPreco++;
    continue;
   }
   const p = S.prods.get(+c.seq) || {};
   const ean = String(c.ean || String(p.ean || "").split(/[,;\s]+/)[0] || "").replace(/\D/g, "");
   if (ean.length < 8) {
    semEan++;
    continue;
   }
   const vv = S.vinc.find((v => +v.loja === +l.loja && +v.conc === +c.conc)) || {};
   const mi7 = String(vv.mi7 || "").trim();
   const base = mi7 || `${lojaNome(l.loja)} - ${l.modeloNome || l.nome} - ${concNome(c.conc)}`;
   const key = safeName(base) + "_C-" + c.conc;
   let f = files.get(key);
   if (!f) {
    f = {
     key: key,
     conc: c.conc,
     dt: 0,
     lines: new Map,
     pesq: new Set,
     lojas: new Set
    };
    files.set(key, f);
   }
   const ex = f.lines.get(ean);
   if (!ex || c.dt >= ex.dt) f.lines.set(ean, {
    dt: c.dt,
    txt: pad0(c.conc, 6) + pad0(ean, 14) + pad0(Math.round(preco * 100), 8) + (c.oferta ? "S" : "N") + "1"
   });
   f.dt = Math.max(f.dt, c.dt || 0);
   f.pesq.add(l.modeloNome || l.nome);
   f.lojas.add(lojaNome(l.loja));
  }
 }
 const out = [ ...files.values() ].map((f => ({
  name: `${ddmm(f.dt || now())} - ${f.key}.txt`,
  text: [ ...f.lines.values() ].map((x => x.txt)).join("\r\n") + "\r\n",
  n: f.lines.size,
  pesq: [ ...f.pesq ].join(", "),
  lojas: [ ...f.lojas ].join(", ")
 })));
 return {
  files: out,
  semEan: semEan,
  semPreco: semPreco
 };
}

async function startLive() {
 const vid = $("#vid");
 let stopped = false;
 const fail = () => {
  const b = $("#vbox");
  if (b) b.hidden = true;
  const m = $("#scMsg");
  if (m) m.textContent = "C\xe2mera ao vivo indispon\xedvel aqui. Use \u201cTirar foto do c\xf3digo\u201d ou digite o EAN.";
 };
 try {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail();
  if ("BarcodeDetector" in window) {
   const bd = new BarcodeDetector({
    formats: [ "ean_13", "ean_8", "upc_a", "upc_e", "code_128", "itf" ]
   });
   const st = await navigator.mediaDevices.getUserMedia({
    video: {
     facingMode: "environment"
    }
   });
   vid.srcObject = st;
   await vid.play();
   SCAN.stop = () => {
    stopped = true;
    st.getTracks().forEach((t => t.stop()));
    SCAN.stop = null;
   };
   const loop = async () => {
    if (stopped) return;
    try {
     const r = await bd.detect(vid);
     if (r && r[0]) return scanDone(r[0].rawValue);
    } catch (e) {}
    setTimeout(loop, 180);
   };
   loop();
   return;
  }
  const r = ZX();
  if (!r) return fail();
  SCAN.stop = () => {
   try {
    r.reset();
   } catch (e) {}
   SCAN.stop = null;
  };
  await r.decodeFromConstraints({
   video: {
    facingMode: "environment"
   }
  }, vid, (res => {
   if (res) scanDone(res.getText());
  }));
 } catch (e) {
  fail();
 }
}

function scanDone(code) {
 if (navigator.vibrate) try {
  navigator.vibrate(60);
 } catch (e) {}
 const cb = SCAN.cb;
 SCAN.cb = null;
 mclose();
 if (cb) cb(String(code).replace(/\D/g, ""));
}

async function decodePhoto(file) {
 const url = URL.createObjectURL(file);
 try {
  if ("BarcodeDetector" in window) {
   const bd = new BarcodeDetector;
   const bmp = await createImageBitmap(file);
   const r = await bd.detect(bmp);
   if (r && r[0]) return r[0].rawValue;
  }
  const z = ZX();
  if (z) {
   const r = await z.decodeFromImageUrl(url);
   return r.getText();
  }
 } catch (e) {} finally {
  URL.revokeObjectURL(url);
 }
 return null;
}

async function compress(file, max = 800) {
 const img = await createImageBitmap(file).catch((() => null));
 if (!img) return null;
 const s = Math.min(1, max / Math.max(img.width, img.height));
 const c = document.createElement("canvas");
 c.width = Math.round(img.width * s);
 c.height = Math.round(img.height * s);
 c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
 return c.toDataURL("image/jpeg", .62);
}

async function hashPw(s) {
 try {
  const b = await crypto.subtle.digest("SHA-256", (new TextEncoder).encode(s));
  return [ ...new Uint8Array(b) ].map((x => x.toString(16).padStart(2, "0"))).join("");
 } catch (e) {
  let h = 0;
  for (const c of s) h = h * 31 + c.charCodeAt(0) | 0;
  return "h" + h;
 }
}

 }
 hist.length = 0;

document.addEventListener("submit", (async e => {
 if (e.target.id !== "flogin") return;
 e.preventDefault();
 const err = m => {
  $("#lgErr").textContent = m;
  $("#lgBtn").disabled = false;
 };
 const lg = $("#lgUser").value.trim().toUpperCase(), pw = $("#lgPin").value.trim();
 $("#lgBtn").disabled = true;
 $("#lgErr").textContent = "";
 const h = await hashPw(lg + "|" + pw);
 S.cfg.cred = S.cfg.cred || {};
 if (HAS_GS && navigator.onLine) {
  try {
   const r = await gs("login", lg, pw);
   S.user = r.user;
   S.token = r.token;
   S.cfg.cred[lg] = {
    h: h,
    user: r.user,
    token: r.token
   };
  } catch (x) {
   const c = S.cfg.cred[lg];
   if (/LOGIN/.test(String(x && x.message || x))) return err("Usu\xe1rio ou senha incorretos.");
   if (c && c.h === h) {
    S.user = c.user;
    S.token = c.token;
   } else return err("N\xe3o foi poss\xedvel conectar ao Google. Verifique a internet.");
  }
 } else {
  const c = S.cfg.cred[lg];
  if (!c || c.h !== h) return err(HAS_GS ? "Sem internet: entre uma vez com internet neste aparelho." : "Este arquivo precisa ser aberto pelo link do Google.");
  S.user = c.user;
  S.token = c.token;
 }
 if (S.cfg.lastLogin !== lg) {
  S.cfg.since = 0;
  S.cfg.lastLogin = lg;
 }
 KV.save("cfg");
 afterLogin();
}));

$("#fileImport").onchange = async e => {
 const f = e.target.files[0];
 e.target.value = "";
 if (!f) return;
 const t = V.t || "produtos";
 try {
  let rows;
  if (window.XLSX) {
   const wb = XLSX.read(await f.arrayBuffer(), {
    type: "array",
    FS: ";",
    raw: false
   });
   rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {
    defval: "",
    raw: false
   });
  } else {
   const tx = await f.text();
   const ln = tx.replace(/^\ufeff/, "").split(/\r?\n/).filter(Boolean);
   const h = ln[0].split(";");
   rows = ln.slice(1).map((l => {
    const c = l.split(";");
    const o = {};
    h.forEach(((k, i) => o[k] = c[i] ?? ""));
    return o;
   }));
  }
  const H = r => {
   const o = {};
   Object.keys(r).forEach((k => o[norm(k).replace(/[^A-Z0-9]/g, "")] = String(r[k]).trim()));
   return o;
  };
  if (t === "produtos") {
   const out = rows.map(H).map((r => ({
    seq: +r.SEQPRODUTO,
    nome: r.NOMEPRODUTO,
    n1: r.N01,
    n2: r.N02,
    n3: r.N03,
    n4: r.N04,
    n5: r.N05,
    custo: pnum(r.CUSTO) || 0,
    avo: r.SEQAVO ? +r.SEQAVO : "",
    alt: r.SEQALT ? +r.SEQALT : "",
    fam: r.SEQFAMILIA ? +r.SEQFAMILIA : "",
    perc: pnum(r.PERCENTUALPROPORCAOPRECO) ?? 100,
    ean: r.EAN || ""
   }))).filter((r => r.seq && r.nome));
   if (!out.length) throw new Error("Nenhuma linha com SEQ-PRODUTO e NOME PRODUTO.");
   if (!await ask(`Substituir a base de produtos por ${out.length.toLocaleString("pt-BR")} produtos do arquivo?`, "Substituir")) return;
   if (!HAS_GS || !navigator.onLine) throw new Error("A importa\xe7\xe3o da base de produtos precisa de internet.");
   $("#app").innerHTML = `<div class="boot"><p class="muted" id="bootMsg">Enviando base para a planilha\u2026</p></div>`;
   await gs("importBegin", authA());
   const per = 4e3;
   for (let i = 0; i < out.length; i += per) {
    bootMsg(`Enviando ${Math.min(i + per, out.length).toLocaleString("pt-BR")} de ${out.length.toLocaleString("pt-BR")}\u2026`);
    await gs("importChunk", authA(), out.slice(i, i + per));
   }
   await gs("importCommit", authA());
   await downloadBase();
   toast("Base de produtos importada");
   render();
   return;
  }
  const D = DEFS[t];
  const map = {};
  D.fields.forEach((([f, lab]) => {
   map[norm(f).replace(/[^A-Z0-9]/g, "")] = f;
   map[norm(lab).replace(/[^A-Z0-9]/g, "")] = f;
  }));
  const alias = {
   CODEMPRESA: "cod",
   IDLOJA: "loja",
   IDCONCORRENTE: t === "concs" ? "id" : "conc",
   NOMECONCORRENTE: "nome",
   CLASSIFICACAOCONC: "classif",
   GEROPERACIONAL: "ger",
   CLUSTERPRECIFICACAO: "cluster",
   STATUSEMPRESA: "status",
   LISTAPESQ: "lista",
   NOMECONCMI7: "nome_mi7"
  };
  const out = rows.map(H).map((r => {
   const o = {};
   Object.keys(r).forEach((k => {
    const f = map[k] || alias[k];
    if (f && o[f] == null) o[f] = D.fields.find((x => x[0] === f))[2] === "n" ? pnum(r[k]) ?? r[k] : r[k];
   }));
   return o;
  })).filter((o => o[D.fields[0][0]] !== "" && o[D.fields[0][0]] != null));
  if (!out.length) throw new Error("Colunas n\xe3o reconhecidas.");
  if (!await ask(`Substituir ${D.t} por ${out.length} registro(s) do arquivo?`, "Substituir")) return;
  S[t] = t === "users" ? out.map((u => ({
   ...u,
   login: String(u.login).toUpperCase(),
   perfil: String(u.perfil || "LOJA").toUpperCase(),
   ativo: u.ativo || "S"
  }))) : out;
  saveCad(t);
  toast(D.t + " importado");
  render();
 } catch (err) {
  render();
  modal(`<h3>N\xe3o foi poss\xedvel importar</h3><p class="small">${esc(err.message || err)}</p><p class="muted small">Use o mesmo formato do arquivo exportado (primeira linha com os nomes das colunas).</p><button class="btn" data-act="mclose">OK</button>`);
 }
};
